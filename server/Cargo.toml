[package]
name = "agent-pixel-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
serde_json = "1"
pixel-geometry = { path = "../core" }
